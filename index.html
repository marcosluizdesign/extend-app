                      className="flex-1 bg-black/50 border border-white/10 rounded-full px-3 py-1.5 text-xs text-white"
                    />
                    <button
                      onClick={() => setShowSearchModal(false)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <div className="space-y-1.5">
                    {Object.values(profiles)
                      .filter(
                        (p) =>
                          p.name
                            .toLowerCase()
                            .includes(searchQuery.toLowerCase()) ||
                          p.handle
                            .toLowerCase()
                            .includes(searchQuery.toLowerCase())
                      )
                      .map((p) => (
                        <button
                          key={p.handle}
                          onClick={() => {
                            setShowSearchModal(false);
                            openUserProfile(p.handle, 'fotos');
                          }}
                          className="w-full flex items-center gap-2.5 p-2 rounded-xl hover:bg-white/5 text-left cursor-pointer"
                        >
                          <img
                            src={p.avatar}
                            alt=""
                            className="w-8 h-8 rounded-full object-cover"
                          />
                          <div>
                            <p className="text-xs font-semibold text-white">
                              {p.name}
                            </p>
                            <p className="text-[10px] text-[#B8FF01]">{p.handle}</p>
                          </div>
                        </button>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {showNotificationsModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-start justify-center p-4 pt-14">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white">Atividade</span>
                    <button
                      onClick={() => setShowNotificationsModal(false)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <div className="space-y-2 text-[11px] text-zinc-300">
                    <div className="p-2.5 rounded-xl bg-white/5">
                      Sua foto <span className="text-[#B8FF01]">Geometria noturna</span>{' '}
                      avançou na barra de alcance.
                    </div>
                    <div className="p-2.5 rounded-xl bg-white/5">
                      <span className="text-[#B8FF01]">@lucas.cine</span> enviou uma
                      solicitação de chat.
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeStoryHandle && (
              <div className="fixed inset-0 z-50 bg-black/95 flex flex-col justify-between p-4">
                <div className="flex items-center justify-between">
                  <button
                    onClick={() => {
                      const h = activeStoryHandle;
                      setActiveStoryHandle(null);
                      openUserProfile(h, 'fotos');
                    }}
                    className="flex items-center gap-2 cursor-pointer"
                  >
                    <img
                      src={
                        (profiles[activeStoryHandle] || profiles['@voce']).avatar
                      }
                      alt=""
                      className="w-8 h-8 rounded-full object-cover ring-1 ring-[#B8FF01]"
                    />
                    <span className="text-xs font-bold text-white">
                      {activeStoryHandle}
                    </span>
                  </button>
                  <button
                    onClick={() => setActiveStoryHandle(null)}
                    className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white cursor-pointer"
                  >
                    <XIcon className="w-4 h-4" />
                  </button>
                </div>

                <div className="w-full max-w-xs mx-auto aspect-[9/16] rounded-3xl overflow-hidden border border-[#B8FF01]/40">
                  <img
                    src={
                      (profiles[activeStoryHandle] || profiles['@voce']).avatar
                    }
                    alt=""
                    className="w-full h-full object-cover"
                  />
                </div>

                <div className="text-center text-[11px] text-zinc-400">
                  Toque no perfil acima para abrir a Galeria
                </div>
              </div>
            )}

            {safetyPost && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-2">
                  <div className="flex items-center justify-between pb-1">
                    <span className="text-xs font-bold text-white">
                      Opções da publicação
                    </span>
                    <button
                      onClick={() => setSafetyPost(null)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <button
                    onClick={() => {
                      setSafetyPost(null);
                      showToast('Conteúdo sinalizado para revisão.');
                    }}
                    className="w-full py-2 px-3 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-zinc-200 flex items-center gap-2 cursor-pointer"
                  >
                    <Flag className="w-3.5 h-3.5 text-amber-400" />
                    <span>Sinalizar como comercial ou impróprio</span>
                  </button>
                  <button
                    onClick={() => {
                      setPosts((prev) =>
                        prev.filter((p) => p.author !== safetyPost.author)
                      );
                      setSafetyPost(null);
                      showToast(`Perfil ${safetyPost.author} bloqueado.`);
                    }}
                    className="w-full py-2 px-3 rounded-xl bg-white/5 hover:bg-red-500/20 text-xs text-red-400 flex items-center gap-2 cursor-pointer"
                  >
                    <Ban className="w-3.5 h-3.5" />
                    <span>Bloquear {safetyPost.author}</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
