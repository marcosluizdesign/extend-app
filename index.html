              liked: nextLiked,
              likes: nextLiked ? p.likes + 1 : p.likes - 1,
              progress: Math.min(100, p.progress + (nextLiked ? 4 : -4)),

                        onClick={() => setActiveTab(tab.id)}
                        className={`flex-1 py-1.5 rounded-full text-xs font-semibold transition cursor-pointer ${
                          activeTab === tab.id
                            ? 'bg-[#B8FF01] text-[#060805] shadow-[0_0_12px_rgba(184,255,1,0.35)]'
                            : 'text-zinc-400 hover:text-zinc-200'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </header>

            {/* CONTEÚDO PRINCIPAL */}
            <main className="flex-1 overflow-y-auto pb-6">
              {nav === 'feed' && (
                <div className="px-3.5 pt-3 space-y-4">
                  {/* Stories */}
                  <div className="flex items-center gap-3 overflow-x-auto pb-1 no-scrollbar">
                    <button
                      onClick={() => setActiveStoryHandle('@voce')}
                      className="flex flex-col items-center gap-1 shrink-0 cursor-pointer group"
                    >
                      <div className="relative p-0.5 rounded-2xl bg-gradient-to-tr from-[#26C400] to-[#E6FF00]">
                        <img
                          src={profiles['@voce'].avatar}
                          alt="Seu story"
                          className="w-12 h-12 rounded-[14px] object-cover border-2 border-[#080B06]"
                        />
                        <span className="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-[#B8FF01] text-black flex items-center justify-center text-[11px] font-bold border border-[#080B06]">
                          +
                        </span>
                      </div>
                      <span className="text-[10px] text-zinc-400 group-hover:text-zinc-200">
                        Seu story
                      </span>
                    </button>

                    {['@clara.luz', '@atelier.norte', '@lucas.cine'].map((h) => {
                      const prof = profiles[h];
                      return (
                        <button
                          key={h}
                          onClick={() => setActiveStoryHandle(h)}
                          className="flex flex-col items-center gap-1 shrink-0 cursor-pointer group"
                        >
                          <div className="p-0.5 rounded-2xl bg-gradient-to-tr from-[#26C400] to-[#B8FF01]">
                            <img
                              src={prof.avatar}
                              alt={prof.name}
                              className="w-12 h-12 rounded-[14px] object-cover border-2 border-[#080B06]"
                            />
                          </div>
                          <span className="text-[10px] text-zinc-400 group-hover:text-zinc-200 max-w-[58px] truncate">
                            {h.replace('@', '')}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Posts do Feed */}
                  {currentFeedPosts.map((post) => {
                    const authorProf = profiles[post.author] || profiles['@voce'];
                    const collabProf = post.collabWith
                      ? profiles[post.collabWith]
                      : null;
                    const isPlaying = playingId === post.id;

                    return (
                      <article
                        key={post.id}
                        className="bg-[#11150E] rounded-3xl border border-white/5 overflow-hidden"
                      >
                        {post.extendedByMe && (
                          <div className="px-3.5 pt-2 flex items-center gap-1.5 text-[10px] text-[#B8FF01] font-medium">
                            <Repeat2 className="w-3 h-3" />
                            <span>Estendido por @voce</span>
                          </div>
                        )}

                        {post.duetFrom && (
                          <div className="px-3.5 pt-2 flex items-center gap-1.5 text-[10px] text-[#B8FF01] font-medium">
                            <Columns2 className="w-3 h-3" />
                            <span>Dueto com {post.duetFrom}</span>
                          </div>
                        )}

                        <div className="px-3.5 py-2.5 flex items-center justify-between">
                          <div className="flex items-center gap-2.5 min-w-0">
                            <button
                              onClick={() => openUserProfile(post.author, post.type)}
                              className="relative flex items-center shrink-0 cursor-pointer"
                            >
                              <img
                                src={authorProf.avatar}
                                alt={authorProf.name}
                                className="w-8 h-8 rounded-full object-cover ring-1 ring-[#B8FF01]/50"
                              />
                              {collabProf && (
                                <img
                                  src={collabProf.avatar}
                                  alt={collabProf.name}
                                  className="w-6 h-6 rounded-full object-cover -ml-2 ring-2 ring-[#11150E]"
                                />
                              )}
                            </button>

                            <div className="min-w-0">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <button
                                  onClick={() =>
                                    openUserProfile(post.author, post.type)
                                  }
                                  className="text-xs font-semibold text-zinc-100 hover:text-[#B8FF01] truncate cursor-pointer"
                                >
                                  {post.author}
                                </button>
                                {collabProf && (
                                  <>
                                    <span className="text-[10px] text-zinc-500">
                                      e
                                    </span>
                                    <button
                                      onClick={() =>
                                        openUserProfile(
                                          collabProf.handle,
                                          post.type
                                        )
                                      }
                                      className="text-xs font-semibold text-zinc-100 hover:text-[#B8FF01] truncate cursor-pointer"
                                    >
                                      {collabProf.handle}
                                    </button>
                                  </>
                                )}
                                {authorProf.isPro && (
                                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-[#B8FF01]/15 text-[#B8FF01]">
                                    PRO
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>

                          <button
                            onClick={() => setSafetyPost(post)}
                            className="p-1 text-zinc-500 hover:text-zinc-300 cursor-pointer"
                          >
                            <MoreHorizontal className="w-4 h-4" />
                          </button>
                        </div>

                        {/* Fotos 3:4 */}
                        {post.type === 'fotos' && (
                          <div className="relative w-full aspect-[3/4] bg-black overflow-hidden">
                            <img
                              src={post.mediaUrl}
                              alt={post.caption}
                              className="w-full h-full object-cover"
                            />

                            {post.audioTrack && (
                              <button
                                onClick={() => setMuted(!muted)}
                                className="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md border border-white/10 px-2.5 py-1 rounded-full flex items-center gap-1.5 text-[10px] text-zinc-200 cursor-pointer"
                              >
                                <Music className="w-3 h-3 text-[#B8FF01]" />
                                <span>{post.audioTrack}</span>
                              </button>
                            )}

                            {post.productTag && (
                              <button
                                onClick={() => setActiveProductHotspot(post)}
                                style={{
                                  left: `${post.productTag.x}%`,
                                  top: `${post.productTag.y}%`,
                                }}
                                className="absolute -translate-x-1/2 -translate-y-1/2 bg-black/80 backdrop-blur-md border border-[#B8FF01] text-[#B8FF01] px-2.5 py-1 rounded-full text-[10px] font-bold flex items-center gap-1 shadow-[0_0_15px_rgba(184,255,1,0.4)] cursor-pointer animate-pulse"
                              >
                                <Tag className="w-2.5 h-2.5" />
                                <span>{post.productTag.price}</span>
                              </button>
                            )}
                          </div>
                        )}

                        {/* Vídeos Curtos 9:16 */}
                        {post.type === 'curtos' && (
                          <div
                            className="relative w-full aspect-[9/16] bg-black overflow-hidden select-none"
                            onMouseDown={(e) => {
                              const rect = e.currentTarget.getBoundingClientRect();
                              if (e.clientX - rect.left > rect.width * 0.55) {
                                setSpeed2xId(post.id);
                              }
                            }}
                            onMouseUp={() => setSpeed2xId(null)}
                            onMouseLeave={() => setSpeed2xId(null)}
                            onTouchStart={(e) => {
                              const touch = e.touches[0];
                              const rect = e.currentTarget.getBoundingClientRect();
                              if (touch.clientX - rect.left > rect.width * 0.55) {
                                setSpeed2xId(post.id);
                              }
                            }}
                            onTouchEnd={() => setSpeed2xId(null)}
                          >
                            <img
                              src={post.mediaUrl}
                              alt={post.caption}
                              className={`w-full h-full object-cover transition-transform duration-500 ${
                                isPlaying ? 'scale-105' : 'scale-100'
                              }`}
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-transparent to-black/20" />

                            {speed2xId === post.id && (
                              <div className="absolute top-3 left-1/2 -translate-x-1/2 bg-black/80 border border-[#B8FF01] text-[#B8FF01] px-3 py-1 rounded-full text-[11px] font-bold flex items-center gap-1">
                                <FastForward className="w-3.5 h-3.5" />
                                <span>Velocidade 2x</span>
                              </div>
                            )}

                            <div className="absolute top-3 right-3 flex items-center gap-1.5">
                              <span className="bg-black/65 px-2 py-0.5 rounded-full text-[10px] text-zinc-300">
                                {post.duration}
                              </span>
                              <button
                                onClick={() => setMuted(!muted)}
                                className="w-7 h-7 rounded-full bg-black/65 flex items-center justify-center text-zinc-200 cursor-pointer"
                              >
                                {muted ? (
                                  <VolumeX className="w-3.5 h-3.5" />
                                ) : (
                                  <Volume2 className="w-3.5 h-3.5" />
                                )}
                              </button>
                            </div>

                            <button
                              onClick={() =>
                                setPlayingId(isPlaying ? null : post.id)
                              }
                              className="absolute inset-0 m-auto w-11 h-11 rounded-full bg-black/50 backdrop-blur-sm border border-white/15 flex items-center justify-center text-[#B8FF01] hover:scale-105 transition cursor-pointer"
                            >
                              {isPlaying ? (
                                <Pause className="w-5 h-5" />
                              ) : (
                                <Play className="w-5 h-5 ml-0.5" />
                              )}
                            </button>

                            <div className="absolute bottom-3 left-3 right-3 flex items-center justify-between">
                              <span className="text-[10px] text-zinc-400">
                                Segure à direita p/ 2x
                              </span>
                              <button
                                onClick={() => setDuetSourcePost(post)}
                                className="bg-black/75 border border-white/15 hover:border-[#B8FF01] text-zinc-100 px-2.5 py-1 rounded-full text-[10px] font-medium flex items-center gap-1 cursor-pointer"
                              >
                                <Columns2 className="w-3 h-3 text-[#B8FF01]" />
                                <span>Dueto</span>
                              </button>
                            </div>
                          </div>
                        )}

                        {/* Vídeos Longos 16:9 */}
                        {post.type === 'longos' && (
                          <div className="relative w-full aspect-[16/9] bg-black overflow-hidden">
                            <img
                              src={post.mediaUrl}
                              alt={post.title || post.caption}
                              className={`w-full h-full object-cover ${
                                !post.unlocked ? 'blur-md scale-105 opacity-60' : ''
                              }`}
                            />

                            {!post.unlocked ? (
                              <div className="absolute inset-0 bg-black/60 flex flex-col items-center justify-center p-4 text-center">
                                <Lock className="w-5 h-5 text-[#B8FF01] mb-1.5" />
                                <p className="text-xs font-semibold text-white">
                                  Vídeo Longo Exclusivo (16:9)
                                </p>
                                <button
                                  onClick={() =>
                                    setCheckoutData({
                                      kind: 'unlock_video',
                                      postId: post.id,
                                      title: post.title || 'Vídeo Exclusivo',
                                      subtitle:
                                        'Acesso vitalício na galeria (85% criador • 15% EXTEND)',
                                      amountBrl: post.exclusivePrice,
                                    })
                                  }
                                  className="mt-2.5 px-3.5 py-1.5 rounded-full bg-[#B8FF01] text-black text-xs font-bold hover:bg-[#c8ff33] transition cursor-pointer"
                                >
                                  Desbloquear • {formatBRL(post.exclusivePrice)}
                                </button>
                              </div>
                            ) : (
                              <>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/25" />
                                <button
                                  onClick={() =>
                                    setPlayingId(isPlaying ? null : post.id)
                                  }
                                  className="absolute inset-0 m-auto w-10 h-10 rounded-full bg-black/55 border border-white/15 flex items-center justify-center text-[#B8FF01] cursor-pointer"
                                >
                                  {isPlaying ? (
                                    <Pause className="w-4 h-4" />
                                  ) : (
                                    <Play className="w-4 h-4 ml-0.5" />
                                  )}
                                </button>

                                <div className="absolute bottom-2.5 left-3 right-3 flex items-center justify-between gap-2">
                                  <span className="text-[10px] bg-black/70 px-2 py-0.5 rounded text-zinc-300">
                                    {post.duration}
                                  </span>
                                  <div className="flex items-center gap-1.5">
                                    <button
                                      onClick={() => setMiniPlayerPost(post)}
                                      className="bg-black/75 border border-white/15 hover:border-[#B8FF01] text-zinc-200 px-2 py-1 rounded-full text-[10px] flex items-center gap-1 cursor-pointer"
                                    >
                                      <Minimize2 className="w-3 h-3 text-[#B8FF01]" />
                                      <span>Mini</span>
                                    </button>
                                    <button
                                      onClick={() => setFullscreenPost(post)}
                                      className="bg-black/75 border border-white/15 hover:border-[#B8FF01] text-zinc-200 px-2.5 py-1 rounded-full text-[10px] flex items-center gap-1 cursor-pointer"
                                    >
                                      <Maximize2 className="w-3 h-3 text-[#B8FF01]" />
                                      <span>Tela cheia</span>
                                    </button>
                                  </div>
                                </div>
                              </>
                            )}
                          </div>
                        )}

                        {/* Barra de Progressão Minimalista 3px */}
                        <div className="w-full h-[3px] bg-white/10 overflow-hidden">
                          <div
                            className="h-full bg-gradient-to-r from-[#26C400] via-[#9EFF00] to-[#E6FF00] transition-all duration-500"
                            style={{ width: `${post.progress}%` }}
                          />
                        </div>

                        <div className="p-3.5 space-y-2.5">
                          {post.title && (
                            <h3 className="text-xs font-bold text-white leading-snug">
                              {post.title}
                            </h3>
                          )}
                          <p className="text-xs text-zinc-300 leading-relaxed">
                            {post.caption}
                          </p>

                          {post.type === 'longos' &&
                            post.unlocked &&
                            post.chapters && (
                              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                                {post.chapters.map((ch, idx) => (
                                  <button
                                    key={idx}
                                    onClick={() => setPlayingId(post.id)}
                                    className="text-[10px] px-2 py-0.5 rounded-full bg-white/5 text-zinc-400 hover:text-[#B8FF01] shrink-0 cursor-pointer"
                                  >
                                    {ch}
                                  </button>
                                ))}
                              </div>
                            )}

                          {post.isCommercial && (
                            <button
                              onClick={() =>
                                openCommercialChat(
                                  post.author,
                                  'Olá! Vi sua publicação comercial no EXTEND.'
                                )
                              }
                              className="w-full py-2 rounded-xl bg-[#B8FF01] hover:bg-[#c8ff33] text-black text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer"
                            >
                              <MessageCircle className="w-3.5 h-3.5" />
                              <span>{post.ctaLabel || 'Iniciar conversa'}</span>
                            </button>
                          )}

                          <div className="pt-1 flex items-center justify-between gap-1 text-zinc-400">
                            <div className="flex items-center gap-3">
                              <button
                                onClick={() => handleToggleLike(post.id)}
                                className={`flex items-center gap-1 text-xs transition cursor-pointer ${
                                  post.liked
                                    ? 'text-[#B8FF01]'
                                    : 'hover:text-zinc-200'
                                }`}
                              >
                                <Heart
                                  className="w-4 h-4"
                                  filled={post.liked}
                                />
                                <span>{post.likes}</span>
                              </button>

                              <button
                                onClick={() => setCommentPostId(post.id)}
                                className="flex items-center gap-1 text-xs hover:text-zinc-200 transition cursor-pointer"
                              >
                                <MessageCircle className="w-4 h-4" />
                                <span>{post.comments.length}</span>
                              </button>

                              <button
                                onClick={() => handleExtendRepost(post.id)}
                                className={`flex items-center gap-1 text-[11px] transition cursor-pointer ${
                                  post.extendedByMe
                                    ? 'text-[#B8FF01] font-semibold'
                                    : 'hover:text-zinc-200'
                                }`}
                              >
                                <Repeat2 className="w-4 h-4" />
                                <span>Estender</span>
                              </button>
                            </div>

                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={() => handleDailyBoost(post.id)}
                                className={`px-2 py-1 rounded-full text-[10px] font-medium border transition cursor-pointer ${
                                  dailyBoostUsed
                                    ? 'border-white/5 text-zinc-600'
                                    : 'border-[#B8FF01]/35 text-[#B8FF01] hover:bg-[#B8FF01]/10'
                                }`}
                              >
                                + Impulso
                              </button>

                              {!post.isCommercial && (
                                <button
                                  onClick={() =>
                                    setCheckoutData({
                                      kind: 'support',
                                      postId: post.id,
                                      title: `Apoiar ${post.author}`,
                                      subtitle:
                                        'Impulso premiado direto ao criador (80% criador • 20% EXTEND)',
                                      amountBrl: 5.0,
                                    })
                                  }
                                  className="px-2 py-1 rounded-full text-[10px] font-medium bg-white/5 hover:bg-white/10 text-zinc-300 transition cursor-pointer"
                                >
                                  Apoiar
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      </article>
                    );
                  })}
                </div>
              )}

              {/* NOVA PUBLICAÇÃO */}
              {nav === 'publicar' && (
                <div className="px-4 pt-4 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-bold text-white">
                      Nova Publicação
                    </h2>
                    <button
                      onClick={() => setNav('feed')}
                      className="p-1 text-zinc-400 hover:text-white cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="grid grid-cols-3 gap-1.5 bg-[#11150E] p-1 rounded-full border border-white/5">
                    {[
                      { id: 'fotos', label: 'Foto (3:4)' },
                      { id: 'curtos', label: 'Curto (9:16)' },
                      { id: 'longos', label: 'Longo (16:9)' },
                    ].map((fmt) => (
                      <button
                        key={fmt.id}
                        onClick={() => setPubFormat(fmt.id)}
                        className={`py-1.5 rounded-full text-[11px] font-semibold transition cursor-pointer ${
                          pubFormat === fmt.id
                            ? 'bg-[#B8FF01] text-black'
                            : 'text-zinc-400 hover:text-zinc-200'
                        }`}
                      >
                        {fmt.label}
                      </button>
                    ))}
                  </div>

                  <div className="bg-[#11150E] rounded-2xl border border-white/5 p-3 flex flex-col items-center gap-3">
                    <div
                      className={`relative bg-black rounded-xl overflow-hidden border border-white/10 ${
                        pubFormat === 'fotos'
                          ? 'w-44 aspect-[3/4]'
                          : pubFormat === 'curtos'
                          ? 'w-36 aspect-[9/16]'
                          : 'w-full aspect-[16/9]'
                      }`}
                    >
                      <img
                        src={pubPreviewUrl}
                        alt="Prévia"
                        className="w-full h-full object-cover"
                      />
                    </div>

                    <input
                      ref={postMediaInputRef}
                      type="file"
                      accept="image/*,video/*"
                      onChange={handlePostMediaUpload}
                      className="hidden"
                    />
                    <button
                      type="button"
                      onClick={() => postMediaInputRef.current?.click()}
                      className="px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-[11px] text-zinc-200 flex items-center gap-1.5 cursor-pointer"
                    >
                      <Upload className="w-3.5 h-3.5 text-[#B8FF01]" />
                      <span>Escolher foto ou vídeo do aparelho</span>
                    </button>
                  </div>

                  <div className="space-y-1.5">
                    <span className="text-[11px] text-zinc-400 block">
                      Direcionamento do disparo
                    </span>
                    <div className="grid grid-cols-3 gap-1.5 bg-[#11150E] p-1 rounded-full border border-white/5">
                      {[
                        { id: 'perto', label: 'Perto (Região)' },
                        { id: 'brasil', label: 'Brasil' },
                        { id: 'mundo', label: 'Mundo' },
                      ].map((sc) => (
                        <button
                          key={sc.id}
                          onClick={() => setPubScope(sc.id)}
                          className={`py-1.5 rounded-full text-[11px] font-semibold transition cursor-pointer ${
                            pubScope === sc.id
                              ? 'bg-[#B8FF01] text-black'
                              : 'text-zinc-400 hover:text-zinc-200'
                          }`}
                        >
                          {sc.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {pubFormat === 'longos' && (
                    <div className="space-y-2.5">
                      <input
                        type="text"
                        value={pubTitle}
                        onChange={(e) => setPubTitle(e.target.value)}
                        placeholder="Título do vídeo longo (16:9)..."
                        className="w-full bg-[#11150E] border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#B8FF01]"
                      />
                      <div className="flex items-center justify-between bg-[#11150E] border border-white/10 rounded-xl px-3 py-2">
                        <span className="text-[11px] text-zinc-300">
                          Vídeo exclusivo pago (R$)
                        </span>
                        <input
                          type="number"
                          min="0"
                          step="1"
                          value={pubExclusivePrice}
                          onChange={(e) => setPubExclusivePrice(e.target.value)}
                          placeholder="0,00 (Grátis)"
                          className="w-24 bg-black/50 border border-white/10 rounded-lg px-2 py-1 text-xs text-right text-[#B8FF01] focus:outline-none"
                        />
                      </div>
                    </div>
                  )}

                  <div className="space-y-2.5">
                    <textarea
                      rows={2}
                      value={pubCaption}
                      onChange={(e) => setPubCaption(e.target.value)}
                      placeholder="Escreva uma legenda..."
                      className="w-full bg-[#11150E] border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#B8FF01]"
                    />

                    <div className="flex items-center gap-2 bg-[#11150E] border border-white/10 rounded-xl px-3 py-2">
                      <Users className="w-3.5 h-3.5 text-zinc-400 shrink-0" />
                      <input
                        type="text"
                        value={pubCollab}
                        onChange={(e) => setPubCollab(e.target.value)}
                        placeholder="Convidar Collab (ex: @clara.luz)"
                        className="w-full bg-transparent text-xs text-white placeholder-zinc-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-between bg-[#11150E] border border-white/10 rounded-2xl px-3.5 py-2.5">
                    <div className="flex items-center gap-2">
                      <span
                        className={`w-2 h-2 rounded-full ${
                          isCommercialPost ? 'bg-amber-400' : 'bg-emerald-400'
                        }`}
                      />
                      <span className="text-xs font-medium text-zinc-200">
                        {isCommercialPost
                          ? `Passe Comercial • US$ ${commercialPriceUsd} (${formatBRL(
                              commercialPriceBrl
                            )})`
                          : 'Publicação Gratuita'}
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() => setManualCommercial(!isCommercialPost)}
                      className="text-[11px] text-zinc-400 underline hover:text-[#B8FF01] cursor-pointer"
                    >
                      Alternar
                    </button>
                  </div>

                  <div className="pt-1 flex justify-center">
                    <button
                      type="button"
                      onClick={handlePublishClick}
                      className="px-7 py-2 rounded-full bg-[#B8FF01] hover:bg-[#c8ff33] text-black text-xs font-bold shadow-[0_0_18px_rgba(184,255,1,0.3)] transition cursor-pointer"
                    >
                      Publicar
                    </button>
                  </div>
                </div>
              )}

              {/* MENSAGENS */}
              {nav === 'chat' && (
                <div className="px-3.5 pt-3 space-y-3">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-bold text-white">Mensagens</h2>
                    <span className="text-[10px] text-zinc-400">
                      Apenas conexões autorizadas
                    </span>
                  </div>

                  <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                    {chats.map((c) => {
                      const p = profiles[c.withHandle] || profiles['@clara.luz'];
                      const isSelected = activeChat?.id === c.id;
                      return (
                        <button
                          key={c.id}
                          onClick={() => setActiveChatId(c.id)}
                          className={`flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs shrink-0 transition cursor-pointer ${
                            isSelected
                              ? 'bg-[#B8FF01]/15 border-[#B8FF01] text-white'
                              : 'bg-[#11150E] border-white/10 text-zinc-400'
                          }`}
                        >
                          <img
                            src={p.avatar}
                            alt={p.name}
                            className="w-5 h-5 rounded-full object-cover"
                          />
                          <span>{c.withHandle}</span>
                          {c.status === 'pending' && (
                            <span className="w-1.5 h-1.5 rounded-full bg-amber-400" />
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {activeChat && (
                    <div className="bg-[#11150E] rounded-3xl border border-white/5 p-3.5 min-h-[380px] flex flex-col justify-between">
                      <div className="flex items-center justify-between pb-2.5 border-b border-white/5">
                        <button
                          onClick={() =>
                            openUserProfile(activeChat.withHandle, 'fotos')
                          }
                          className="flex items-center gap-2 text-left cursor-pointer"
                        >
                          <img
                            src={
                              (
                                profiles[activeChat.withHandle] ||
                                profiles['@clara.luz']
                              ).avatar
                            }
                            alt=""
                            className="w-8 h-8 rounded-full object-cover"
                          />
                          <div>
                            <p className="text-xs font-semibold text-white">
                              {activeChat.withHandle}
                            </p>
                            <span className="text-[10px] text-[#B8FF01]">
                              {activeChat.tag}
                            </span>
                          </div>
                        </button>
                      </div>

                      {activeChat.status === 'pending' ? (
                        <div className="my-auto py-8 text-center space-y-3">
                          <Lock className="w-6 h-6 text-[#B8FF01] mx-auto" />
                          <div className="space-y-1">
                            <p className="text-xs font-semibold text-white">
                              Solicitação de conexão de {activeChat.withHandle}
                            </p>
                            <p className="text-[11px] text-zinc-400">
                              Motivo: {activeChat.tag}. O envio de texto está
                              bloqueado até você permitir.
                            </p>
                          </div>
                          <div className="flex items-center justify-center gap-2 pt-1">
                            <button
                              onClick={() => {
                                setChats((prev) =>
                                  prev.map((c) =>
                                    c.id === activeChat.id
                                      ? { ...c, status: 'approved' }
                                      : c
                                  )
                                );
                                showToast('Conexão autorizada!');
                              }}
                              className="px-4 py-1.5 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                            >
                              Aceitar
                            </button>
                            <button
                              onClick={() => {
                                setChats((prev) =>
                                  prev.filter((c) => c.id !== activeChat.id)
                                );
                                showToast('Solicitação recusada.');
                              }}
                              className="px-4 py-1.5 rounded-full bg-white/5 text-zinc-300 text-xs cursor-pointer"
                            >
                              Recusar
                            </button>
                          </div>
                        </div>
                      ) : (
                        <>
                          <div className="flex-1 py-3 space-y-2.5 overflow-y-auto max-h-[260px]">
                            {activeChat.messages.map((m) => (
                              <div
                                key={m.id}
                                className={`flex flex-col max-w-[82%] rounded-2xl px-3 py-2 text-xs ${
                                  m.from === '@voce'
                                    ? 'ml-auto bg-[#B8FF01] text-black font-medium'
                                    : 'bg-white/5 text-zinc-200'
                                }`}
                              >
                                <span>{m.text}</span>
                                <span
                                  className={`text-[9px] mt-0.5 self-end ${
                                    m.from === '@voce'
                                      ? 'text-black/60'
                                      : 'text-zinc-500'
                                  }`}
                                >
                                  {m.time}
                                </span>
                              </div>
                            ))}
                          </div>

                          <form
                            onSubmit={handleSendChatMessage}
                            className="pt-2 border-t border-white/5 flex items-center gap-2"
                          >
                            <input
                              type="text"
                              value={chatInput}
                              onChange={(e) => setChatInput(e.target.value)}
                              placeholder="Escreva sua mensagem..."
                              className="flex-1 bg-black/50 border border-white/10 rounded-full px-3.5 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#B8FF01]"
                            />
                            <button
                              type="submit"
                              className="w-8 h-8 rounded-full bg-[#B8FF01] text-black flex items-center justify-center shrink-0 cursor-pointer"
                            >
                              <Send className="w-3.5 h-3.5" />
                            </button>
                          </form>
                        </>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* GALERIA / PERFIL */}
              {nav === 'perfil' && (
                <div className="px-3.5 pt-3 space-y-4">
                  {!isMyProfile && (
                    <button
                      onClick={() => setNav('feed')}
                      className="flex items-center gap-1 text-xs text-zinc-400 hover:text-white cursor-pointer"
                    >
                      <ArrowLeft className="w-3.5 h-3.5" />
                      <span>Voltar ao feed</span>
                    </button>
                  )}

                  <div className="bg-[#11150E] rounded-3xl border border-white/5 p-4 space-y-3">
                    <div className="flex items-center gap-3.5">
                      <div className="relative shrink-0">
                        <input
                          ref={avatarInputRef}
                          type="file"
                          accept="image/*"
                          onChange={handleAvatarFileChange}
                          className="hidden"
                        />
                        <button
                          type="button"
                          onClick={() => {
                            if (isMyProfile) avatarInputRef.current?.click();
                          }}
                          className={`relative block rounded-full ${
                            isMyProfile ? 'cursor-pointer group' : 'cursor-default'
                          }`}
                        >
                          <img
                            src={viewedProfile.avatar}
                            alt={viewedProfile.name}
                            className="w-16 h-16 rounded-full object-cover ring-2 ring-[#B8FF01]"
                          />
                          {isMyProfile && (
                            <span className="absolute bottom-0 right-0 w-5 h-5 rounded-full bg-[#B8FF01] text-black flex items-center justify-center border-2 border-[#11150E]">
                              <Camera className="w-3 h-3" />
                            </span>
                          )}
                        </button>
                      </div>

                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-1.5">
                          <h2 className="text-sm font-bold text-white truncate">
                            {viewedProfile.name}
                          </h2>
                          {viewedProfile.isPro && (
                            <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-[#B8FF01]/15 text-[#B8FF01]">
                              PRO
                            </span>
                          )}
                        </div>
                        <p className="text-xs text-[#B8FF01]">
                          {viewedProfile.handle}
                        </p>
                        <p className="text-[11px] text-zinc-400 mt-1 line-clamp-2">
                          {viewedProfile.bio}
                        </p>
                      </div>
                    </div>

                    <div className="w-full h-[3px] bg-white/10 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-gradient-to-r from-[#26C400] to-[#B8FF01]"
                        style={{ width: `${viewedProfile.progress}%` }}
                      />
                    </div>

                    {isMyProfile ? (
                      <div className="flex items-center gap-2 pt-1">
                        <button
                          onClick={() => setShowWalletModal(true)}
                          className="flex-1 py-1.5 px-3 rounded-full bg-[#B8FF01]/15 border border-[#B8FF01]/40 text-[#B8FF01] text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <Wallet className="w-3.5 h-3.5" />
                          <span>Carteira • {formatBRL(walletBalance)}</span>
                        </button>

                        {!profiles['@voce'].isPro && (
                          <button
                            onClick={() => setShowProModal(true)}
                            className="py-1.5 px-3 rounded-full bg-white/5 hover:bg-white/10 text-zinc-200 text-xs font-medium flex items-center gap-1 cursor-pointer"
                          >
                            <Crown className="w-3.5 h-3.5 text-[#B8FF01]" />
                            <span>EXTEND Pro</span>
                          </button>
                        )}
                      </div>
                    ) : (
                      <div className="pt-1">
                        <button
                          onClick={() => setChatRequestTarget(viewedProfile.handle)}
                          className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <MessageCircle className="w-3.5 h-3.5" />
                          <span>Solicitar Chat</span>
                        </button>
                      </div>
                    )}
                  </div>

                  <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    {(viewedProfile.folders || ['Todas']).map((folder) => (
                      <button
                        key={folder}
                        onClick={() => setSelectedFolder(folder)}
                        className={`px-3 py-1 rounded-full text-[11px] flex items-center gap-1 shrink-0 border transition cursor-pointer ${
                          selectedFolder === folder
                            ? 'bg-[#B8FF01] text-black border-[#B8FF01] font-semibold'
                            : 'bg-[#11150E] text-zinc-400 border-white/5'
                        }`}
                      >
                        <Folder className="w-3 h-3" />
                        <span>{folder}</span>
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-3 gap-1 bg-[#11150E] p-1 rounded-full border border-white/5">
                    {[
                      { id: 'fotos', label: 'Fotos' },
                      { id: 'curtos', label: 'Curtos' },
                      { id: 'longos', label: 'Longos' },
                    ].map((t) => (
                      <button
                        key={t.id}
                        onClick={() => setProfileTab(t.id)}
                        className={`py-1 rounded-full text-[11px] font-semibold transition cursor-pointer ${
                          profileTab === t.id
                            ? 'bg-[#B8FF01] text-black'
                            : 'text-zinc-400'
                        }`}
                      >
                        {t.label}
                      </button>
                    ))}
                  </div>

                  {profilePosts.length === 0 ? (
                    <div className="py-10 text-center text-xs text-zinc-500">
                      Nenhuma publicação nesta aba da galeria.
                    </div>
                  ) : (
                    <div
                      className={`grid gap-2 ${
                        profileTab === 'longos' ? 'grid-cols-1' : 'grid-cols-2'
                      }`}
                    >
                      {profilePosts.map((item) => (
                        <div
                          key={item.id}
                          onClick={() => {
                            setActiveTab(item.type);
                            setNav('feed');
                          }}
                          className="group relative bg-[#11150E] rounded-2xl overflow-hidden border border-white/5 cursor-pointer"
                        >
                          <div
                            className={`w-full overflow-hidden ${
                              item.type === 'fotos'
                                ? 'aspect-[3/4]'
                                : item.type === 'curtos'
                                ? 'aspect-[9/16]'
                                : 'aspect-[16/9]'
                            }`}
                          >
                            <img
                              src={item.mediaUrl}
                              alt={item.caption}
                              className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                            />
                          </div>
                          <div className="w-full h-[3px] bg-white/10">
                            <div
                              className="h-full bg-[#B8FF01]"
                              style={{ width: `${item.progress}%` }}
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* MINI PLAYER FLUTUANTE 16:9 */}
            {miniPlayerPost && (
              <div className="fixed bottom-16 right-4 z-40 w-44 bg-[#11150E] border border-[#B8FF01]/50 rounded-2xl overflow-hidden shadow-2xl">
                <div className="relative aspect-[16/9] bg-black">
                  <img
                    src={miniPlayerPost.mediaUrl}
                    alt=""
                    className="w-full h-full object-cover"
                  />
                  <button
                    onClick={() => setMiniPlayerPost(null)}
                    className="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/80 text-white flex items-center justify-center cursor-pointer"
                  >
                    <XIcon className="w-3 h-3" />
                  </button>
                  <button
                    onClick={() => {
                      setFullscreenPost(miniPlayerPost);
                      setMiniPlayerPost(null);
                    }}
                    className="absolute bottom-1 right-1 px-1.5 py-0.5 rounded bg-black/80 text-[9px] text-[#B8FF01] cursor-pointer"
                  >
                    Expandir
                  </button>
                </div>
              </div>
            )}

            {/* BARRA INFERIOR COM ÍCONES REDONDOS E CENTRALIZADOS */}
            <nav className="sticky bottom-0 z-30 bg-[#080B06]/95 backdrop-blur-md border-t border-white/5 px-4 py-2.5 flex items-center justify-center gap-5">
              <button
                onClick={() => setNav('feed')}
                className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition cursor-pointer ${
                  nav === 'feed'
                    ? 'bg-[#B8FF01]/15 ring-1 ring-[#B8FF01]/60'
                    : 'bg-[#11150E] border border-white/10 opacity-80 hover:opacity-100'
                }`}
                title="Feed EXTEND"
              >
                <ExtendIcon className="w-5 h-5" />
              </button>

              <button
                onClick={() => setNav('publicar')}
                className="w-9 h-9 rounded-full shrink-0 bg-[#B8FF01] hover:bg-[#c8ff33] text-[#060805] flex items-center justify-center shadow-[0_0_18px_rgba(184,255,1,0.45)] transition cursor-pointer"
                title="Publicar"
              >
                <Plus className="w-5 h-5" />
              </button>

              <button
                onClick={() => setNav('chat')}
                className={`relative w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition cursor-pointer ${
                  nav === 'chat'
                    ? 'bg-[#B8FF01]/15 text-[#B8FF01] ring-1 ring-[#B8FF01]/60'
                    : 'bg-[#11150E] border border-white/10 text-zinc-400 hover:text-[#B8FF01]'
                }`}
                title="Mensagens"
              >
                <MessageCircle className="w-4 h-4" />
                {chats.some((c) => c.status === 'pending') && (
                  <span className="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-[#B8FF01]" />
                )}
              </button>

              <button
                onClick={() => openUserProfile('@voce', 'fotos')}
                className={`h-9 flex items-center gap-1.5 pl-1.5 pr-3 rounded-full border shrink-0 transition cursor-pointer ${
                  nav === 'perfil' && isMyProfile
                    ? 'border-[#B8FF01] bg-[#11150E] text-[#B8FF01]'
                    : 'border-white/10 bg-[#11150E] text-zinc-300 hover:border-[#B8FF01]/40'
                }`}
                title="Galeria"
              >
                <img
                  src={profiles['@voce'].avatar}
                  alt="Galeria"
                  className="w-6 h-6 rounded-full object-cover"
                />
                <span className="text-[11px] font-medium">Galeria</span>
              </button>
            </nav>

            {/* MODAIS */}
            {fullscreenPost && (
              <div className="fixed inset-0 z-50 bg-black/95 flex flex-col justify-between p-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-semibold text-white">
                    {fullscreenPost.title}
                  </span>
                  <button
                    onClick={() => setFullscreenPost(null)}
                    className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white cursor-pointer"
                  >
                    <XIcon className="w-4 h-4" />
                  </button>
                </div>

                <div className="w-full max-w-2xl mx-auto aspect-[16/9] bg-black rounded-2xl overflow-hidden border border-white/10 relative">
                  <img
                    src={fullscreenPost.mediaUrl}
                    alt=""
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute bottom-0 inset-x-0 h-[3px] bg-white/15">
                    <div
                      className="h-full bg-[#B8FF01]"
                      style={{ width: `${fullscreenPost.progress}%` }}
                    />
                  </div>
                </div>

                <div className="flex items-center justify-center gap-2 flex-wrap">
                  {(fullscreenPost.chapters || []).map((ch, idx) => (
                    <span
                      key={idx}
                      className="text-[11px] px-3 py-1 rounded-full bg-white/10 text-zinc-200"
                    >
                      {ch}
                    </span>
                  ))}
                </div>
              </div>
            )}

            {activeProductHotspot && activeProductHotspot.productTag && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-[#B8FF01]">
                      Produto na Foto
                    </span>
                    <button
                      onClick={() => setActiveProductHotspot(null)}
                      className="text-zinc-400 hover:text-white cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <p className="text-sm font-semibold text-white">
                    {activeProductHotspot.productTag.name}
                  </p>
                  <p className="text-base font-bold text-[#B8FF01]">
                    {activeProductHotspot.productTag.price}
                  </p>
                  <button
                    onClick={() =>
                      openCommercialChat(
                        activeProductHotspot.author,
                        `Olá! Tenho interesse no item: ${activeProductHotspot.productTag.name} (${activeProductHotspot.productTag.price}).`
                      )
                    }
                    className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                  >
                    Iniciar conversa comercial
                  </button>
                </div>
              </div>
            )}

            {duetSourcePost && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white">
                      Dueto 9:16 com {duetSourcePost.author}
                    </span>
                    <button
                      onClick={() => setDuetSourcePost(null)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-1 aspect-[9/10] rounded-2xl overflow-hidden bg-black border border-white/10">
                    <img
                      src={duetSourcePost.mediaUrl}
                      alt=""
                      className="w-full h-full object-cover"
                    />
                    <img
                      src={profiles['@voce'].avatar}
                      alt=""
                      className="w-full h-full object-cover"
                    />
                  </div>

                  <input
                    type="text"
                    value={duetCaption}
                    onChange={(e) => setDuetCaption(e.target.value)}
                    placeholder="Legenda do seu dueto..."
                    className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs text-white"
                  />

                  <button
                    onClick={handlePublishDuet}
                    className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                  >
                    Publicar
                  </button>
                </div>
              </div>
            )}

            {commentPost && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-end sm:items-center justify-center p-4">
                <div className="w-full max-w-sm bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white">
                      Comentários
                    </span>
                    <button
                      onClick={() => setCommentPostId(null)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="space-y-2 max-h-48 overflow-y-auto">
                    {commentPost.comments.length === 0 ? (
                      <p className="text-xs text-zinc-500 text-center py-4">
                        Seja o primeiro a comentar.
                      </p>
                    ) : (
                      commentPost.comments.map((c) => (
                        <div
                          key={c.id}
                          className="bg-white/5 rounded-xl px-3 py-2 text-xs"
                        >
                          <span className="font-semibold text-[#B8FF01] mr-1.5">
                            {c.user}
                          </span>
                          <span className="text-zinc-200">{c.text}</span>
                        </div>
                      ))
                    )}
                  </div>

                  <form onSubmit={handleAddComment} className="flex gap-2">
                    <input
                      type="text"
                      value={commentDraft}
                      onChange={(e) => setCommentDraft(e.target.value)}
                      placeholder="Adicionar comentário..."
                      className="flex-1 bg-black/50 border border-white/10 rounded-full px-3 py-1.5 text-xs text-white"
                    />
                    <button
                      type="submit"
                      className="px-3 py-1.5 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                    >
                      Enviar
                    </button>
                  </form>
                </div>
              </div>
            )}

            {checkoutData && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-[#B8FF01]/30 rounded-3xl p-4 space-y-3.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-[#B8FF01]">
                      Pagamento Instantâneo
                    </span>
                    <button
                      onClick={() => setCheckoutData(null)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>

                  <div>
                    <p className="text-sm font-bold text-white">
                      {checkoutData.title}
                    </p>
                    <p className="text-[11px] text-zinc-400 mt-0.5">
                      {checkoutData.subtitle}
                    </p>
                    <p className="text-lg font-extrabold text-[#B8FF01] mt-2">
                      {formatBRL(checkoutData.amountBrl)}
                    </p>
                  </div>

                  <div className="grid grid-cols-2 gap-1.5 bg-black/40 p-1 rounded-full">
                    <button
                      onClick={() => setPaymentMethod('pix')}
                      className={`py-1 rounded-full text-[11px] font-semibold flex items-center justify-center gap-1 cursor-pointer ${
                        paymentMethod === 'pix'
                          ? 'bg-[#B8FF01] text-black'
                          : 'text-zinc-400'
                      }`}
                    >
                      <QrCode className="w-3 h-3" />
                      <span>Pix</span>
                    </button>
                    <button
                      onClick={() => setPaymentMethod('card')}
                      className={`py-1 rounded-full text-[11px] font-semibold flex items-center justify-center gap-1 cursor-pointer ${
                        paymentMethod === 'card'
                          ? 'bg-[#B8FF01] text-black'
                          : 'text-zinc-400'
                      }`}
                    >
                      <CreditCard className="w-3 h-3" />
                      <span>Cartão</span>
                    </button>
                  </div>

                  {paymentMethod === 'pix' ? (
                    <div className="bg-black/50 border border-white/10 rounded-2xl p-3 text-center space-y-2">
                      <div className="w-24 h-24 mx-auto bg-white rounded-xl flex items-center justify-center text-black">
                        <QrCode className="w-16 h-16" />
                      </div>
                      <button
                        onClick={copyPixCode}
                        className="w-full py-1.5 rounded-full bg-white/10 text-[11px] text-zinc-200 flex items-center justify-center gap-1.5 cursor-pointer"
                      >
                        <Copy className="w-3 h-3 text-[#B8FF01]" />
                        <span>
                          {copiedPix ? 'Código Pix copiado!' : 'Copiar código Pix'}
                        </span>
                      </button>
                    </div>
                  ) : (
                    <div className="bg-black/50 border border-white/10 rounded-2xl p-3 text-xs text-zinc-300">
                      Cartão final •••• 4829 pronto para aprovação em 1 toque.
                    </div>
                  )}

                  <button
                    onClick={handleConfirmPayment}
                    className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                  >
                    Confirmar Pagamento
                  </button>
                </div>
              </div>
            )}

            {showWalletModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white">
                      Carteira do Criador
                    </span>
                    <button
                      onClick={() => setShowWalletModal(false)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="bg-black/50 rounded-2xl p-3 border border-[#B8FF01]/20">
                    <span className="text-[11px] text-zinc-400">
                      Saldo disponível para saque
                    </span>
                    <p className="text-xl font-extrabold text-[#B8FF01]">
                      {formatBRL(walletBalance)}
                    </p>
                  </div>

                  <div className="space-y-1.5 max-h-36 overflow-y-auto">
                    {transactions.map((tx) => (
                      <div
                        key={tx.id}
                        className="flex items-center justify-between bg-white/5 rounded-xl px-3 py-2 text-[11px]"
                      >
                        <div>
                          <p className="text-zinc-200 font-medium">{tx.label}</p>
                          <span className="text-[10px] text-zinc-500">
                            {tx.splitInfo}
                          </span>
                        </div>
                        <span className="font-bold text-[#B8FF01]">
                          +{formatBRL(tx.net)}
                        </span>
                      </div>
                    ))}
                  </div>

                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={pixWithdrawKey}
                      onChange={(e) => setPixWithdrawKey(e.target.value)}
                      placeholder="Sua chave Pix..."
                      className="flex-1 bg-black/50 border border-white/10 rounded-full px-3 py-1.5 text-xs text-white"
                    />
                    <button
                      onClick={() => {
                        if (walletBalance <= 0) return;
                        setWalletBalance(0);
                        setShowWalletModal(false);
                        showToast('Transferência Pix solicitada!');
                      }}
                      className="px-3.5 py-1.5 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                    >
                      Sacar Pix
                    </button>
                  </div>
                </div>
              </div>
            )}

            {showProModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-[#B8FF01]/30 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-[#B8FF01] flex items-center gap-1">
                      <Crown className="w-3.5 h-3.5" />
                      EXTEND Pro
                    </span>
                    <button
                      onClick={() => setShowProModal(false)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <p className="text-xs text-zinc-300 leading-relaxed">
                    Inclui 5 Passes Comerciais por mês, selo PRO verificado e
                    respostas rápidas no chat comercial.
                  </p>
                  <button
                    onClick={() =>
                      setCheckoutData({
                        kind: 'pro_plan',
                        title: 'Assinatura EXTEND Pro',
                        subtitle: '5 Passes Comerciais inclusos todo mês',
                        amountBrl: 69.9,
                      })
                    }
                    className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                  >
                    Assinar • R$ 69,90/mês
                  </button>
                </div>
              </div>
            )}

            {chatRequestTarget && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white">
                      Conectar com {chatRequestTarget}
                    </span>
                    <button
                      onClick={() => setChatRequestTarget(null)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <p className="text-[11px] text-zinc-400">
                    Escolha o motivo para pedir permissão de mensagem:
                  </p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {['Amizade', 'Trabalho / Orçamento', 'Parceria', 'Dúvida'].map(
                      (tag) => (
                        <button
                          key={tag}
                          onClick={() =>
                            handleRequestChatConnection(chatRequestTarget, tag)
                          }
                          className="py-2 px-2.5 rounded-xl bg-white/5 hover:bg-[#B8FF01] hover:text-black text-[11px] font-medium text-zinc-200 transition cursor-pointer"
                        >
                          {tag}
                        </button>
                      )
                    )}
                  </div>
                </div>
              </div>
            )}

            {showAccountModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3.5">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <ExtendIcon className="w-6 h-6" />
                      <span className="text-xs font-bold text-white">
                        Minha Conta
                      </span>
                    </div>
                    <button
                      onClick={() => setShowAccountModal(false)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="space-y-2">
                    <input
                      type="text"
                      value={editName}
                      onChange={(e) => setEditName(e.target.value)}
                      className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white"
                      placeholder="Seu nome"
                    />
                    <input
                      type="text"
                      value={editHandle}
                      onChange={(e) => setEditHandle(e.target.value)}
                      className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-[#B8FF01]"
                      placeholder="@seu.arroba"
                    />
                  </div>

                  <button
                    onClick={() => {
                      setProfiles((prev) => ({
                        ...prev,
                        '@voce': {
                          ...prev['@voce'],
                          name: editName || 'Você',
                        },
                      }));
                      setShowAccountModal(false);
                      showToast('Dados da conta salvos!');
                    }}
                    className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                  >
                    Salvar Perfil
                  </button>
                </div>
              </div>
            )}

            {showMobileModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <ExtendIcon className="w-6 h-6" />
                      <span className="text-xs font-bold text-white">
                        Instalar no Celular
                      </span>
                    </div>
                    <button
                      onClick={() => setShowMobileModal(false)}
                      className="text-zinc-400 cursor-pointer"
                    >
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                  <p className="text-[11px] text-zinc-300 leading-relaxed">
                    No navegador do celular, toque no menu (Chrome) ou em
                    Compartilhar (Safari) e escolha{' '}
                    <span className="text-[#B8FF01] font-semibold">
                      Adicionar à Tela de Início
                    </span>{' '}
                    para instalar o ícone oficial do EXTEND.
                  </p>
                  <button
                    onClick={() => {
                      setMobileFrameMode(!mobileFrameMode);
                      setShowMobileModal(false);
                    }}
                    className="w-full py-2 rounded-full bg-[#B8FF01] text-black text-xs font-bold cursor-pointer"
                  >
                    {mobileFrameMode
                      ? 'Sair da Moldura Celular'
                      : 'Simular Moldura Celular Aqui'}
                  </button>
                </div>
              </div>
            )}

            {showSearchModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-start justify-center p-4 pt-14">
                <div className="w-full max-w-xs bg-[#11150E] border border-white/10 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      autoFocus
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar criadores (@)..."
